name: Test Execution

on:
  push:
    branches: [ main , master]
  pull_request:
    branches: [ main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/**', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Node.js (for Playwright if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: (Optional) Install Playwright browsers
        if: ${{ always() }}
        run: |
          npm i -g playwright
          playwright install --with-deps || true
        shell: bash

      - name: Run Gradle tests
        run: ./gradlew test --no-daemon --stacktrace

